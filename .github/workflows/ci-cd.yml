name: Trading Bot CI/CD (Gradle)

on:
  pull_request:
    branches: [ main, release/** ]
  push:
    branches: [ release/** ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      actions: read

    steps:      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Gradle Wrapper Validation
        run: ./gradlew --version

      - name: Gradle Build & Compile
        run: ./gradlew clean build -x test --no-daemon

      # Только базовый тест контекста (contextLoads) — пока этого достаточно
      - name: Gradle Test
        run: ./gradlew test --no-daemon

      - name: Security Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build BootJar
        run: ./gradlew bootJar --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-bot-jar
          path: build/libs/trading-bot-1.0.0.jar