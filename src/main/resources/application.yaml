spring:
  profiles:
    active: backtest
  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: INFO
    com.tradingbot: DEBUG

risk:
  max-risk-per-trade: 0.01
  max-daily-loss: 0.05

flyway:
  enabled: false