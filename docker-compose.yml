version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  trading-bot:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: live
    ports:
      - "8080:8080"

volumes:
  postgres_data: